name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
      - run: bun install --frozen-lockfile
      - name: Check the actual branch name
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bun run lint:branch-name "$BRANCH_NAME"
      - run: bun run check
